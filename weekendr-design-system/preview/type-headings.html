<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { gap: 14px; padding: 24px 32px; }
  .row { display: grid; grid-template-columns: 1fr 180px; align-items: baseline; gap: 24px; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-muted); text-align: right; }
  .h1 { font-family: "Fraunces", serif; font-weight: 700; font-size: 48px; line-height: 1.05; letter-spacing: -0.02em; font-variation-settings: "opsz" 96, "SOFT" 30; }
  .h2 { font-family: "Fraunces", serif; font-weight: 600; font-size: 34px; line-height: 1.15; letter-spacing: -0.01em; font-variation-settings: "opsz" 72, "SOFT" 30; }
  .h3 { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 700; font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; }
  .h4 { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 600; font-size: 18px; line-height: 1.25; }
</style></head>
<body>
  <div class="row"><div class="h1">Plan a weekend</div><div class="meta">H1 · Fraunces 700 · 48/1.05</div></div>
  <div class="row"><div class="h2">Things to do this Saturday</div><div class="meta">H2 · Fraunces 600 · 34/1.15</div></div>
  <div class="row"><div class="h3">Your favorites</div><div class="meta">H3 · Jakarta 700 · 24/1.2</div></div>
  <div class="row"><div class="h4">Two hours, indoor, $12 a kid</div><div class="meta">H4 · Jakarta 600 · 18/1.25</div></div>
</body></html>
