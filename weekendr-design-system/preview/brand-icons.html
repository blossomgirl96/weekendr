<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  body { gap: 16px; padding: 26px 32px; flex-direction: row; align-items: center; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 8px; min-width: 70px; }
  .ico { color: var(--ink-700); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 0; }
  .head { font-family: "Plus Jakarta Sans", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); width: 100%; }
</style></head>
<body>
  <span class="head">Lucide · 1.75 stroke · stroke-only</span>
  <div class="item"><i class="ico" data-lucide="sun" width="28" height="28" stroke-width="1.75"></i><span class="lbl">sun</span></div>
  <div class="item"><i class="ico" data-lucide="map-pin" width="28" height="28" stroke-width="1.75"></i><span class="lbl">map-pin</span></div>
  <div class="item"><i class="ico" data-lucide="calendar" width="28" height="28" stroke-width="1.75"></i><span class="lbl">calendar</span></div>
  <div class="item"><i class="ico" data-lucide="heart" width="28" height="28" stroke-width="1.75"></i><span class="lbl">heart</span></div>
  <div class="item"><i class="ico" data-lucide="users" width="28" height="28" stroke-width="1.75"></i><span class="lbl">users</span></div>
  <div class="item"><i class="ico" data-lucide="trees" width="28" height="28" stroke-width="1.75"></i><span class="lbl">trees</span></div>
  <div class="item"><i class="ico" data-lucide="ticket" width="28" height="28" stroke-width="1.75"></i><span class="lbl">ticket</span></div>
  <div class="item"><i class="ico" data-lucide="search" width="28" height="28" stroke-width="1.75"></i><span class="lbl">search</span></div>
  <div class="item"><i class="ico" data-lucide="filter" width="28" height="28" stroke-width="1.75"></i><span class="lbl">filter</span></div>
  <div class="item"><i class="ico" data-lucide="bookmark" width="28" height="28" stroke-width="1.75"></i><span class="lbl">bookmark</span></div>
  <div class="item"><i class="ico" data-lucide="plus" width="28" height="28" stroke-width="1.75"></i><span class="lbl">plus</span></div>
  <div class="item"><i class="ico" data-lucide="check" width="28" height="28" stroke-width="1.75"></i><span class="lbl">check</span></div>
  <script>lucide.createIcons();</script>
</body></html>
