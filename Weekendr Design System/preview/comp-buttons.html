<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { gap: 18px; padding: 26px 32px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { font-family: "Plus Jakarta Sans", sans-serif; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 150ms cubic-bezier(0.22,1,0.36,1); border-radius: 999px; padding: 12px 22px; }
  .primary { background: var(--terracotta-500); color: white; border: 2px solid var(--ink-700); box-shadow: 0 4px 0 var(--ink-700); }
  .primary:hover { background: var(--terracotta-600); transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink-700); }
  .primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink-700); }
  .secondary { background: white; color: var(--ink-700); border: 1.5px solid var(--cream-300); box-shadow: var(--shadow-sm); }
  .secondary:hover { border-color: var(--ink-700); }
  .ghost { background: transparent; color: var(--terracotta-600); border: none; }
  .ghost:hover { background: var(--terracotta-50); }
  .pine { background: var(--pine-500); color: white; border: none; box-shadow: var(--shadow-sm); }
  .pine:hover { background: var(--pine-600); }
  .danger { background: white; color: var(--danger); border: 1.5px solid #E5BCB6; }
  .danger:hover { background: #FBEEEC; }
  .small { font-size: 13px; padding: 8px 16px; }
  .large { font-size: 17px; padding: 14px 28px; }
  .lbl { font-size: 11px; color: var(--fg-muted); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-right: 8px; min-width: 70px; }
</style></head>
<body>
  <div class="row"><span class="lbl">Primary</span>
    <button class="primary">Plan a weekend</button>
    <button class="primary small">Add to Saturday</button>
    <button class="primary large">Get started</button>
  </div>
  <div class="row"><span class="lbl">Secondary</span>
    <button class="secondary">Browse activities</button>
    <button class="ghost">Skip for now</button>
    <button class="pine">Mark as done</button>
    <button class="danger">Remove</button>
  </div>
</body></html>
