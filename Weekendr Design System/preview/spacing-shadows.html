<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { gap: 18px; padding: 32px 28px; flex-direction: row; flex-wrap: wrap; align-items: flex-end; justify-content: space-around; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 84px; height: 64px; background: white; border-radius: 14px; }
  .pop { width: 84px; height: 64px; background: var(--terracotta-500); border-radius: 14px; border: 2px solid var(--ink-700); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); text-align: center; }
  .val { font-family: "Plus Jakarta Sans", sans-serif; font-size: 12px; font-weight: 600; color: var(--ink-700); }
</style></head>
<body>
  <div class="item"><div class="box" style="box-shadow: 0 1px 0 rgba(38,31,24,0.04)"></div><div class="val">xs</div><div class="lbl">subtle line</div></div>
  <div class="item"><div class="box" style="box-shadow: 0 1px 2px rgba(38,31,24,0.06), 0 1px 1px rgba(38,31,24,0.04)"></div><div class="val">sm</div><div class="lbl">resting cards</div></div>
  <div class="item"><div class="box" style="box-shadow: 0 4px 10px -2px rgba(38,31,24,0.08), 0 2px 4px rgba(38,31,24,0.05)"></div><div class="val">md</div><div class="lbl">menus, popovers</div></div>
  <div class="item"><div class="box" style="box-shadow: 0 12px 24px -8px rgba(38,31,24,0.14), 0 4px 8px rgba(38,31,24,0.06)"></div><div class="val">lg</div><div class="lbl">hovered cards</div></div>
  <div class="item"><div class="box" style="box-shadow: 0 24px 48px -16px rgba(38,31,24,0.18)"></div><div class="val">xl</div><div class="lbl">modals</div></div>
  <div class="item"><div class="pop" style="box-shadow: 0 6px 0 var(--ink-700)"></div><div class="val">pop</div><div class="lbl">marketing CTA only</div></div>
</body></html>
