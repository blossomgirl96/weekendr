<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { gap: 14px; padding: 24px 28px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--terracotta-300); border-radius: 4px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
  .val { font-family: "Plus Jakarta Sans", sans-serif; font-size: 12px; font-weight: 600; color: var(--ink-700); }
  h4 { font-family: "Plus Jakarta Sans", sans-serif; font-size: 13px; font-weight: 600; color: var(--ink-400); margin-bottom: -4px; }
</style></head>
<body>
  <h4>Spacing — 4-based scale</h4>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px;height:80px"></div><div class="val">4</div><div class="lbl">space-1</div></div>
    <div class="item"><div class="bar" style="width:8px;height:80px"></div><div class="val">8</div><div class="lbl">space-2</div></div>
    <div class="item"><div class="bar" style="width:12px;height:80px"></div><div class="val">12</div><div class="lbl">space-3</div></div>
    <div class="item"><div class="bar" style="width:16px;height:80px"></div><div class="val">16</div><div class="lbl">space-4</div></div>
    <div class="item"><div class="bar" style="width:20px;height:80px"></div><div class="val">20</div><div class="lbl">space-5</div></div>
    <div class="item"><div class="bar" style="width:24px;height:80px"></div><div class="val">24</div><div class="lbl">space-6</div></div>
    <div class="item"><div class="bar" style="width:32px;height:80px"></div><div class="val">32</div><div class="lbl">space-8</div></div>
    <div class="item"><div class="bar" style="width:40px;height:80px"></div><div class="val">40</div><div class="lbl">space-10</div></div>
    <div class="item"><div class="bar" style="width:48px;height:80px"></div><div class="val">48</div><div class="lbl">space-12</div></div>
    <div class="item"><div class="bar" style="width:64px;height:80px"></div><div class="val">64</div><div class="lbl">space-16</div></div>
    <div class="item"><div class="bar" style="width:80px;height:80px"></div><div class="val">80</div><div class="lbl">space-20</div></div>
  </div>
</body></html>
